name: Build Astro
description: This is a composite action

inputs:
  node-version:
    description: Node version you want to use for building
    required: false
    default: 22
  artifact-name:
    description: Name of the build artifact
    required: false
    default: dist

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: "npm"

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Build package
      run: npm run build
      shell: bash

    - name: Upload build artifact
      run: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: dist/
